<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#fbc2eb,#fdaecb);
}

.container{
    width:90%;
    max-width:420px;
    padding:30px;
    border-radius:12px;

    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(12px);

    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

h2{
    text-align:center;
    color:#b03060;
    margin-bottom:20px;
    font-weight:600;
}

.input-box{
    position:relative;
    margin-bottom:15px;
}

.input-box i{
    position:absolute;
    left:12px;
    top:12px;
    color:#d63384;
    font-size:14px;
}

.input-box input,
.input-box select,
.input-box textarea{
    width:100%;
    padding:10px 10px 10px 35px;
    border:1px solid #f3a6c8;
    border-radius:6px;
    outline:none;
    font-size:14px;
}

textarea{
    resize:none;
}

.radio-group,
.checkbox-group{
    margin-bottom:12px;
    font-size:14px;
    color:#444;
}

.radio-group input,
.checkbox-group input{
    margin-right:6px;
}

button{
    width:100%;
    padding:11px;
    border:none;
    border-radius:6px;

    background:linear-gradient(45deg,#e754a2,#d63384);
    color:white;

    font-size:15px;
    font-weight:500;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:linear-gradient(45deg,#d63384,#c2186a);
}

/* Responsive Design */

@media (max-width:500px){

    .container{
        padding:20px;
    }

    h2{
        font-size:22px;
    }

    input,select,textarea{
        font-size:13px;
    }
}
</style>

</head>

<body>

<div class="container">

<h2>Registration Form</h2>

<form>

<label>Full Name</label>
<input type="text" required>

<label>Email</label>
<input type="email" required>

<label>Password</label>
<input type="password" required>

<label>Country</label>
<select>
<option>Select Country</option>
<option>USA</option>
<option>UK</option>
<option>Canada</option>
<option>Netherlands</option>
<option>India</option>
</select>

<label>Gender</label>
<div class="radio-group">
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
</div>

<label>Skills</label>
<div class="checkbox-group">
<input type="checkbox"> HTML
<input type="checkbox"> CSS
<input type="checkbox"> JavaScript
<input type="checkbox"> Python
</div>

<label>Address</label>
<textarea rows="4" placeholder="Enter your address"></textarea>

<button type="submit">Register</button>

</form>

</div>

</body>
</html>
